<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Steganography - Steganography Toolkit</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-..."
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body class="dedicated-page">
    <header class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="/">Steganography Toolkit</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/image">Image</a>
          <a class="nav-link" href="/audio">Audio</a>
          <a class="nav-link" href="/text">Text</a>
        </div>
      </div>
    </header>

    <main class="container py-5">
      <h1 class="mb-4">Audio Steganography</h1>
      <p class="lead text-muted mb-4">
        Hide messages in WAV audio files using LSB encoding.
      </p>

      <div class="row gy-4">
        <div class="col-12" id="alerts"></div>

        <div class="col-12">
          <ul class="nav nav-tabs" id="audioTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="encode-tab"
                data-bs-toggle="tab"
                data-bs-target="#encode"
                type="button"
                role="tab"
                aria-controls="encode"
                aria-selected="true"
              >
                Encode
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="decode-tab"
                data-bs-toggle="tab"
                data-bs-target="#decode"
                type="button"
                role="tab"
                aria-controls="decode"
                aria-selected="false"
              >
                Decode
              </button>
            </li>
          </ul>
          <div class="tab-content pt-3" id="audioTabsContent">
            <div
              class="tab-pane fade show active"
              id="encode"
              role="tabpanel"
              aria-labelledby="encode-tab"
            >
              <form id="encodeForm">
                <input type="hidden" name="mode" value="audio" />
                <div class="mb-3">
                  <label class="form-label">Cover audio (WAV)</label>
                  <input class="form-control" type="file" accept="audio/wav" name="coverFile" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Message</label>
                  <textarea class="form-control" name="message" rows="3" placeholder="Your secret message..."></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Output filename</label>
                  <input class="form-control" name="outputName" placeholder="my_secret" />
                  <div class="form-text">The output file will be downloaded as a WAV.</div>
                </div>
                <button type="submit" class="btn btn-primary">Encode &amp; Download</button>
              </form>
            </div>

            <div class="tab-pane fade" id="decode" role="tabpanel" aria-labelledby="decode-tab">
              <form id="decodeForm">
                <input type="hidden" name="mode" value="audio" />
                <div class="mb-3">
                  <label class="form-label">Stego audio (WAV)</label>
                  <input class="form-control" type="file" accept="audio/wav" name="stegoFile" required />
                </div>
                <button type="submit" class="btn btn-primary">Decode</button>
              </form>
              <div class="mt-3">
                <label class="form-label">Decoded message</label>
                <pre id="decodeResult" class="form-control" style="white-space: pre-wrap; min-height: 5rem;"></pre>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <a href="/" class="btn btn-secondary">← Back to Home</a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
    <script src="/static/js/audio.js"></script>
  </body>
</html>
